<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodion Novikov - marketer, builder</title>
    <style>
        @font-face {
            font-family: 'InstrumentSerif';
            src: url('InstrumentSerif-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'InstrumentSerif', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .hero-section {
            display: flex;
            align-items: center;
            gap: 40px;
            justify-content: space-between;
            padding: 30px 60px;
            background-color: #1c1c1e;
            border-radius: 20px;
            width: 100%;
        }

        .text-content {
            flex: 1;
            min-width: 200px;
        }

        .text-content h1 {
            font-size: 48px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .text-content p {
            font-size: 24px;
            color: #a1a1a6;
            font-weight: 400;
        }

        .support-text {
            flex-shrink: 0;
            max-width: 360px;
            text-align: right;
        }

        .support-text p {
            font-size: 27px;
            color: #ffffff;
            line-height: 1.6;
            margin: 0;
        }

        .apps-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .app-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            padding: 28px 24px;
            background-color: #1c1c1e;
            border-radius: 20px;
            text-align: center;
        }

        .app-block-icon {
            display: block;
            width: 80px;
            aspect-ratio: 1;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .app-block-icon:hover {
            transform: translateY(-4px);
        }

        .app-block-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 18%;
        }

        .app-block-name {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
        }

        .copyright {
            text-align: center;
            padding: 0;
            color: #6e6e73;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                gap: 15px;
            }

            .hero-section {
                flex-direction: column;
                padding: 20px 30px;
                gap: 24px;
                align-items: flex-start;
            }

            .text-content {
                min-width: auto;
                width: 100%;
            }

            .text-content h1 {
                font-size: 32px;
            }

            .text-content p {
                font-size: 18px;
            }

            .support-text {
                max-width: none;
                text-align: left;
            }

            .support-text p {
                font-size: 18px;
            }

            .apps-list {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 15px;
            }

            .app-block {
                padding: 24px 16px;
                gap: 16px;
            }

            .app-block-icon {
                width: 64px;
            }

            .app-block-name {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="text-content">
                <h1>Rodion Novikov</h1>
                <p>marketer, builder</p>
            </div>
            <div class="support-text">
                <p>Issues? Request support at naiv.agency@gmail.com</p>
            </div>
        </div>

        <div class="apps-list">
            <div class="app-block">
                <a class="app-block-icon" href="https://apps.apple.com/us/app/procrastination-solved-acty/id6751211430" target="_blank" rel="noopener noreferrer">
                    <img src="Assets/App Icons/acty_app_icon.png" alt="Acty">
                </a>
                <span class="app-block-name">Acty</span>
            </div>
            <div class="app-block">
                <a class="app-block-icon" href="https://apps.apple.com/us/app/dream-interpretation-ai-app/id1670009423" target="_blank" rel="noopener noreferrer">
                    <img src="Assets/App Icons/dmai_app_icon.png" alt="Dream AI">
                </a>
                <span class="app-block-name">Dream AI</span>
            </div>
            <div class="app-block">
                <a class="app-block-icon" href="https://apps.apple.com/us/app/blob-to-do-task-list/id6744033382" target="_blank" rel="noopener noreferrer">
                    <img src="Assets/App Icons/blobtodo_app_icon.png" alt="Blob To Do">
                </a>
                <span class="app-block-name">Blob To Do</span>
            </div>
            <div class="app-block">
                <a class="app-block-icon" href="https://apps.apple.com/us/app/e4c5-app-blocker/id6757018750" target="_blank" rel="noopener noreferrer">
                    <img src="Assets/App Icons/e4c5_app_icon.png" alt="e4c5 app blocker">
                </a>
                <span class="app-block-name">e4c5<br>app blocker</span>
            </div>
            <div class="app-block">
                <a class="app-block-icon" href="http://apps.apple.com/us/app/bible-verse-widget-kjv/id6794831675" target="_blank" rel="noopener noreferrer">
                    <img src="Assets/App Icons/bibw_app_icon.png" alt="Bible Verse Widget">
                </a>
                <span class="app-block-name">Bible Verse<br>Widget</span>
            </div>
        </div>

        <div class="copyright">
            <p>2026 Rodion Novikov. Any questions? naiv.agency@gmail.com</p>
        </div>
    </div>
</body>
</html>
